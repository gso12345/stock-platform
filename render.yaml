services:
  - type: web
    name: stock-platform-api
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --forwarded-allow-ips: Render는 프록시 뒤에 있어 이 옵션이 없으면
    # 모든 접속자의 client.host가 프록시 주소 하나로 잡힌다. 그러면 IP 기준
    # 제한(WebSocket 동시 연결 수 등)이 '서비스 전체' 상한처럼 작동해,
    # 접속자가 조금만 늘어도 뒷사람은 시세를 아예 못 받는다.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://stock-platform-one.vercel.app
      # 스레드마다 따로 힙(arena)을 만들지 않게 막는다.
      #
      # glibc 는 스레드가 malloc 을 부를 때 잠금 경합을 줄이려고 힙을 여러
      # 개 만든다. 상한이 CPU 개수 × 8 이라 이 서버는 최대 수십 개가 된다.
      # 힙이 나뉘면 빈 자리도 따로 놀아서, 한쪽에 남는 자리가 있어도 다른
      # 쪽은 새로 받아 온다. 그렇게 '해제했는데 안 돌려준' 몫이 불어난다 —
      # 프로덕션에서 485MB 중 245.6MB 가 그 몫이었다(실제 사용은 158.7MB).
      #
      # 스레드는 23개인데 CPU 는 0.15개다. 경합을 줄이려고 힙을 나눠 봐야
      # 애초에 동시에 돌 수가 없으니, 얻는 것 없이 조각만 늘어난다.
      #
      # 다만 이건 프로덕션 규모에서만 확인할 수 있다. 로컬에서 흉내 내
      # 재봤지만 힙이 4MB 수준이라 차이가 안 나왔다. 배포 후 관리자 화면의
      # '비었지만 붙들고 있음' 이 줄었는지로 판단한다. 효과가 없으면 이
      # 줄만 지우면 된다.
      - key: MALLOC_ARENA_MAX
        value: "2"
