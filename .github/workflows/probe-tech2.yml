name: 배포 확인(임시) — 기술적 분석 정확도 개선
on:
  push:
    branches: [claude/initial-load-performance-2RJGW]
    paths: [".github/workflows/probe-tech2.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 운영 화면·서버를 읽기만 해서 확인
        shell: python
        run: |
          import json, re, time, urllib.request, urllib.parse, urllib.error
          WEB = "https://stock-platform-one.vercel.app"
          API = "https://stock-platform-ksmu.onrender.com/api/v1"

          def get(u, t=120):
              p = urllib.parse.urlsplit(u)
              u = urllib.parse.urlunsplit(p._replace(path=urllib.parse.quote(p.path)))
              r = urllib.request.Request(u, headers={"User-Agent": "deploy-probe"})
              try:
                  with urllib.request.urlopen(r, timeout=t) as res:
                      return res.status, res.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          표식 = {"신호 줄": "기술적 신호만 보면", "시험 결과": "여러 종목을 10년 동안 시험해 보면", "오차 범위": "지난 3년 예상 오차로 본 50% 범위",
                  "반영 문구": "반영했어요", "가까운 차례": "지표가 오늘과 가까운 차례예요", "예상에 씀": "예상에 씀"}
          for 번 in range(24):
              _, html = get(WEB + "/predict")
              html = html.decode("utf-8", "replace")
              entry = [x for x in set(re.findall(r'/assets/[^"\'\s]+?\.js', html)) if "/index-" in x]
              글 = {}
              for x in entry:
                  글[x] = get(WEB + x)[1].decode("utf-8", "replace")
                  for y in set(re.findall(r'assets/[^"\'`\s)]+?\.js', 글[x])):
                      y = "/" + y
                      if y not in 글 and "Predict-" in y:
                          s, b = get(WEB + y)
                          글[y] = b.decode("utf-8", "replace") if s == 200 else ""
              결과 = {이름: any(k in s for n, s in 글.items() if "Predict-" in n) for 이름, k in 표식.items()}
              print(f"[화면 {번}] 파일 {len(글)}개 {결과}", flush=True)
              if all(결과.values()):
                  break
              time.sleep(30)

          for 번 in range(40):
              s, b = get(f"{API}/predict/KR/005930")
              새것 = s == 200 and b'"range_kind"' in b
              print(f"[서버 {번}] KR/005930 → {s} 새 셈={'있음' if 새것 else '없음'}", flush=True)
              if 새것:
                  break
              time.sleep(30)

          def 퍼(a, b):
              return f"{(a / b - 1) * 100:+.1f}%"
          for 시장, 종목 in (("KR", "005930"), ("KR", "000660"), ("KR", "035420"), ("US", "AAPL"), ("US", "NVDA"), ("US", "TSLA")):
              시작 = time.time()
              s, b = get(f"{API}/predict/{시장}/{종목}")
              걸림 = time.time() - 시작
              if s != 200:
                  print(시장, 종목, s, b[:200]); continue
              d = json.loads(b)
              t = d.get("technical")
              print(f"== {d['name']}({종목}) {s} {걸림:.1f}초 · {d['as_of']} 종가 {d['price']} {d['currency']}", flush=True)
              if not t:
                  print("   기술: 없음(None)"); continue
              for h in t["horizons"]:
                  c = h["check"] or {}
                  P0 = d["price"]
                  print(f"   {h['label']:>3} 신호 {h['signal']}({퍼(h['signal'], P0)}) [{h['method_label']}] 반영 {h['weight']} → 예상 {h['predicted']}({퍼(h['predicted'], P0)}) "
                        f"· 50% {h['range']}({퍼(h['range'][0], P0)}~{퍼(h['range'][1], P0)}) {h['range_kind']} · 지난 {c.get('n')}번 적중 {c.get('in50')} "
                        f"gain {c.get('gain')} 쓴오차 {c.get('mae_used')} 방향 {c.get('direction_used')} · 옛 필드 {'t' in c or 'beats_flat' in c}", flush=True)
          시작 = time.time(); s, _ = get(f"{API}/predict/KR/005930"); print(f"다시 물음 {s} {time.time() - 시작:.2f}초")
          for 시장, 종목 in (("US", "ZZZQQX"), ("KR", "999990")):
              s, b = get(f"{API}/predict/{시장}/{종목}")
              print("없는 종목", 시장, 종목, s, b[:120].decode("utf-8", "replace"))
