## 임시 — 배포 뒤 운영 서버가 비던 ETF 보유비중을 이제 주는지 본다(읽기만, GET). 확인이 끝나면 이 파일을 지운다.
name: ETF 구성 살펴보기(임시)

on:
  push:
    branches: [claude/initial-load-performance-2RJGW]
    paths: [".github/workflows/etf-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 운영 서버 — 비던 ETF 가 이제 나오나(배포가 끝날 때까지 기다리며)
        run: |
          cat > prod.py <<'PY'
          import json, time, urllib.request
          운영 = "https://stock-platform-ksmu.onrender.com/api/v1/stocks/ETF/{}/holdings"
          UA = {"User-Agent": "stock-platform-probe"}

          def 묻기(sym):
              try:
                  with urllib.request.urlopen(urllib.request.Request(운영.format(sym), headers=UA), timeout=80) as r:
                      return r.status, json.loads(r.read().decode("utf-8", "replace"))
              except Exception as e:
                  return None, {"error": f"{type(e).__name__}: {e}"}

          # 새 서버가 뜨면 360750 이 total(전체 개수)과 함께 온다 — 예전 서버는 total 을 모른다
          for 번 in range(36):
              s, j = 묻기("360750")
              if j.get("total"):
                  print(f"새 서버 확인({번 * 20}초 기다림)")
                  break
              print(f"아직 예전 서버이거나 캐시 — {s} holdings={len(j.get('holdings') or [])} reason={j.get('reason')!r}")
              time.sleep(20)
          for i, sym in enumerate(["360750", "459580", "132030", "122630", "SCHD", "ARKK", "SOXL", "SPY", "QQQ"]):
              if i:
                  time.sleep(7)       # 분당 10회 제한
              s, j = 묻기(sym)
              h = j.get("holdings") or []
              print(f"운영 {sym} [{s}] holdings={len(h)} total={j.get('total')} as_of={j.get('as_of')} source={j.get('source')!r} "
                    f"reason={j.get('reason')!r} 앞={json.dumps([(x.get('name'), x.get('symbol'), x.get('market')) for x in h[:3]], ensure_ascii=False)}")
          PY
          python3 -u prod.py
