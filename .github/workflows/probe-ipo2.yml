name: 배포 확인(임시) — 공모주 확약·철회
on:
  push:
    branches: [claude/initial-load-performance-2RJGW]
    paths: [".github/workflows/probe-ipo2.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 운영 화면·서버를 읽기만 해서 확인
        shell: python
        run: |
          import json, re, time, urllib.request, urllib.parse, urllib.error
          WEB = "https://stock-platform-one.vercel.app"
          API = "https://stock-platform-ksmu.onrender.com/api/v1"

          def get(u, t=180):
              p = urllib.parse.urlsplit(u)
              u = urllib.parse.urlunsplit(p._replace(path=urllib.parse.quote(p.path)))
              r = urllib.request.Request(u, headers={"User-Agent": "deploy-probe"})
              try:
                  with urllib.request.urlopen(r, timeout=t) as res:
                      return res.status, res.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
              except Exception as e:
                  return 0, repr(e).encode()

          표식 = "의무보유확약이 아직 안 나와"
          for 번 in range(40):
              _, html = get(WEB + "/ipo")
              html = html.decode("utf-8", "replace")
              entry = [x for x in set(re.findall(r'/assets/[^"\'\s]+?\.js', html)) if "/index-" in x]
              있음 = False
              본 = set()
              for x in entry:
                  글 = get(WEB + x)[1].decode("utf-8", "replace")
                  for y in set(re.findall(r'assets/[^"\'`\s)]+?\.js', 글)):
                      if "Ipo" in y and y not in 본:
                          본.add(y)
                          s, b = get(WEB + "/" + y)
                          있음 |= s == 200 and 표식 in b.decode("utf-8", "replace")
              print(f"[화면 {번}] 공모주 화면 파일 {sorted(본)} 확약 안내 {있음}", flush=True)
              if 있음:
                  break
              time.sleep(30)

          def 한눈에():
              s, b = get(f"{API}/ipo")
              return json.loads(b) if s == 200 else None

          def 엠비디(d):
              return next((u for u in d.get("upcoming") or [] if u.get("name") == "엠비디"), None)

          for 번 in range(50):
              d = 한눈에()
              m = 엠비디(d) if d else None
              ok = bool(m and (m.get("prediction") or {}).get("ok"))
              print(f"[서버 {번}] 엠비디 예측 {'됨' if ok else '안 됨'} · 받은 때 {d and d.get('as_of')} · 새로 받는 중 {d and d.get('refreshing')}", flush=True)
              if ok:
                  break
              time.sleep(30)

          def 보기(이름, d):
              m = 엠비디(d) or {}
              p = m.get("prediction") or {}
              print(f"== {이름} · 받은 때 {d.get('as_of')} · 새로 받는 중 {d.get('refreshing')}", flush=True)
              print(f"   엠비디 공모가 {m.get('offer_price')} 기관 {m.get('inst_ratio')} 확약 {m.get('lockup_pct')} 청약 {m.get('sub_start')}~{m.get('sub_end')}", flush=True)
              if p.get("ok"):
                  print(f"   예측 {p.get('price')}원({p.get('return_pct')}%) 범위 {p['range']['low_price']}~{p['range']['high_price']} "
                        f"따블 {p.get('p_double')} 공모가 아래 {p.get('p_below')} · 견준 {p.get('used')} · 빠진 {p.get('missing')} · 방식 {(p.get('method') or {}).get('name')}", flush=True)
              else:
                  print(f"   예측 안 됨 — {p.get('reason')}", flush=True)
              이름들 = [u.get("name") for u in d.get("upcoming") or []]
              print(f"   다가오는 {len(이름들)}곳 · 씨앤엠 {'씨앤엠' in 이름들} · 제이앤티지 {'제이앤티지' in 이름들}", flush=True)
              a = d.get("accuracy") or {}
              print(f"   적중률 ±{a.get('hit_band_pct')}% 안 {a.get('hit_rate')} · 보통 차이 {a.get('median_abs_diff_pct')}% · {a.get('n')}곳 · 청약 전 {(a.get('pre_sub') or {}).get('hit_rate')}", flush=True)
              안됨 = [(u.get("name"), u.get("stage"), (u.get("prediction") or {}).get("reason")) for u in d.get("upcoming") or []
                      if not (u.get("prediction") or {}).get("ok") and u.get("offer_price")]
              print(f"   확정 공모가가 있는데 예측 안 된 것: {안됨}", flush=True)

          d = 한눈에()
          보기("새 서버 첫 응답", d)
          # 자료가 30분 넘게 묵었으면 뒤에서 새로 받는다 — 끝날 때까지 기다렸다가 다시 본다
          for 번 in range(40):
              if not d.get("refreshing"):
                  break
              time.sleep(15)
              d = 한눈에()
          보기("새로 받은 뒤", d)
          s, b = get(f"{API}/ipo/calendar.ics")
          글 = b.decode("utf-8", "replace")
          print(f"달력 {s} · 씨앤엠 {'씨앤엠' in 글} · 제이앤티지 {'제이앤티지' in 글} · 엠비디 {'엠비디' in 글}", flush=True)
