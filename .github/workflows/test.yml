## main 에 올릴 때마다 서버·화면 시험을 돌린다.
##
## 예전에는 main 에 올리면 시험 없이 곧장 Render·Vercel 로 나갔다. 시험은 서버 88개·화면 146개
## 파일이나 있는데 사람이 손으로 돌릴 때만 돌았다. 여기서 돌면 깨진 것이 올라갔을 때 GitHub 에
## 빨간 표시가 뜬다. Render 설정에서 자동 배포를 '시험 통과 후(After CI checks pass)' 로 바꾸면
## 깨진 서버는 아예 안 나간다.
##
## 시험은 바깥에 안 나간다
##   서버 시험은 야후·네이버가 막혀 있다고 보고 짜여 있다(개발 환경도 바깥이 막혀 있다). GitHub
##   일꾼은 바깥에 나갈 수 있어서, 그대로 두면 그날 야후 응답에 따라 결과가 바뀌고 느려진다.
##   모든 HTTP 를 닿지 않는 프록시(127.0.0.1:9)로 돌려 '막힌 바깥' 을 만든다.
name: 시험

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: 서버 시험
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # backend/runtime.txt
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: 꾸러미 설치
        run: python -m pip install -r requirements-dev.txt
      - name: 시험
        run: python -m pytest -q
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,testserver
          no_proxy: localhost,127.0.0.1,testserver

  screen:
    name: 화면 시험·빌드
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 꾸러미 설치
        run: npm ci
      - name: 타입 검사·빌드(Vercel 과 같은 명령)
        run: npm run build
      - name: 시험
        run: npm test
