name: 자료 모양 확인(임시) — 연간 재무·투자지표
on:
  push:
    branches: [claude/initial-load-performance-2RJGW]
    paths: [".github/workflows/probe-fin.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 운영 서버를 읽기만 해서 확인
        shell: python
        run: |
          import json, time, urllib.request, urllib.error
          API = "https://stock-platform-ksmu.onrender.com/api/v1"

          def get(u, t=120):
              r = urllib.request.Request(u, headers={"User-Agent": "deploy-probe"})
              try:
                  with urllib.request.urlopen(r, timeout=t) as res:
                      return res.status, res.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
              except Exception as e:
                  return 0, repr(e).encode()

          for 번 in range(6):
              s, _ = get(f"{API}/stocks/KR/005930/price", 90)
              print("깨우기", s, flush=True)
              if s == 200:
                  break
              time.sleep(20)

          종목들 = [("KR", "005930"), ("KR", "000660"), ("KR", "035420"), ("KR", "005380"), ("KR", "247540"),
                    ("US", "AAPL"), ("US", "NVDA"), ("US", "MSFT"), ("US", "TSLA"), ("US", "TSM")]
          칸들 = ("net_income", "total_equity", "eps", "revenue", "op_income")
          for 시장, 종목 in 종목들:
              for 번 in range(2):
                  s, b = get(f"{API}/stocks/{시장}/{종목}/financials")
                  if s == 200:
                      d = json.loads(b)
                      if d.get("annual"):
                          break
                  time.sleep(8)
              print(f"== {시장} {종목} financials {s} source={d.get('source') if s == 200 else '-'}", flush=True)
              if s == 200:
                  for r in d.get("annual", []):
                      print("   연", r.get("period"), {k: r.get(k) for k in 칸들}, "그밖 칸:", sorted(k for k in r if k not in 칸들 and k != "period"))
                  print("   분기 기간:", [r.get("period") for r in d.get("quarterly", [])])
                  print("   맨 위 열쇠:", sorted(d))
              s, b = get(f"{API}/stocks/{시장}/{종목}/fundamentals")
              if s == 200:
                  f = json.loads(b)
                  print("   지표", {k: f.get(k) for k in ("per", "pbr", "eps", "bps", "forward_per", "market_cap", "trailing_pe", "price_to_book", "shares_outstanding")}, flush=True)
              else:
                  print("   지표", s, b[:150])
