name: 임시 — 주가예측 개선 평가용 시세 받기
on:
  push:
    branches: [claude/initial-load-performance-2RJGW]
    paths: [".github/workflows/predict-data.yml"]
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q yfinance==1.7.0 pandas numpy
      - name: 야후에서 10년치 일봉 받기(읽기만)
        shell: python
        run: |
          import gzip, os, time
          import yfinance as yf
          KR = ["005930.KS", "000660.KS", "035420.KS", "035720.KS", "005380.KS", "000270.KS", "051910.KS", "006400.KS",
                "068270.KS", "105560.KS", "055550.KS", "012330.KS", "028260.KS", "066570.KS", "003550.KS", "017670.KS",
                "030200.KS", "015760.KS", "034730.KS", "096770.KS", "032830.KS", "009150.KS", "018260.KS", "011200.KS",
                "010130.KS", "207940.KS", "086790.KS", "033780.KS", "010950.KS", "034220.KS",
                "247540.KQ", "086520.KQ", "028300.KQ", "196170.KQ", "035900.KQ", "041510.KQ", "263750.KQ", "058470.KQ",
                "039030.KQ", "091990.KQ"]
          US = ["AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "TSLA", "BRK-B", "JPM", "V", "JNJ", "WMT", "PG", "XOM",
                "UNH", "HD", "KO", "PEP", "INTC", "AMD", "NFLX", "DIS", "BA", "CSCO", "ORCL", "CRM", "ADBE", "PFE", "MRK",
                "CVX", "T", "NKE", "MCD", "IBM", "QCOM", "COST", "GS", "CAT", "MMM", "GE"]
          줄 = ["symbol,date,close,volume"]
          실패 = []
          for s in KR + US + ["^KS11", "^GSPC"]:
              for 번 in range(4):
                  try:
                      h = yf.Ticker(s).history(period="10y", interval="1d", auto_adjust=False, raise_errors=True)
                      h = h.dropna(subset=["Close"])
                      for ts, r in h.iterrows():
                          v = r.get("Volume")
                          v = "" if v is None or v != v else str(int(v))
                          줄.append(f"{s},{ts.strftime('%Y-%m-%d')},{float(r['Close']):.10g},{v}")
                      print(s, len(h), h.index[0].strftime('%Y-%m-%d') if len(h) else None, flush=True)
                      break
                  except Exception as e:
                      print(s, "다시", 번, type(e).__name__, str(e)[:120], flush=True)
                      time.sleep(5 * (번 + 1))
              else:
                  실패.append(s)
              time.sleep(0.4)
          print("못 받음", 실패)
          os.makedirs("predict-eval", exist_ok=True)
          with gzip.open("predict-eval/prices.csv.gz", "wt", encoding="utf-8") as f:
              f.write("\n".join(줄) + "\n")
          print("줄", len(줄), "크기", os.path.getsize("predict-eval/prices.csv.gz"))
      - name: 작업 브랜치에 올리기(평가 뒤 지운다)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predict-eval/prices.csv.gz
          git commit -m "임시 — 주가예측 개선 평가용 시세(평가 뒤 지운다)"
          git push
