## 임시 — 배포 뒤 운영 서버의 백테스트(진행률·상세 분석·유니버스 이름)를 확인한다. 읽기·계산만(저장하지 않는다). 확인이 끝나면 지운다.
name: 백테스트 배포 확인(임시)

on:
  push:
    branches: [claude/initial-load-performance-2RJGW]
    paths: [".github/workflows/bt-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 운영 서버 — 새 백테스트가 도나(배포가 끝날 때까지 기다리며)
        run: |
          cat > prod.py <<'PY'
          import json, time, urllib.request, urllib.error
          API = "https://stock-platform-ksmu.onrender.com/api/v1"
          H = {"User-Agent": "stock-platform-probe", "Content-Type": "application/json"}

          def 요청(길, 몸=None, 시한=120):
              req = urllib.request.Request(API + 길, data=json.dumps(몸).encode() if 몸 else None, headers=H)
              try:
                  with urllib.request.urlopen(req, timeout=시한) as r:
                      return r.status, json.loads(r.read().decode("utf-8", "replace"))
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")[:300]
              except Exception as e:
                  return None, f"{type(e).__name__}: {e}"

          # 새 서버는 /backtest/progress/{열쇠} 에 200 {} 로 답한다(예전 서버는 404)
          for 번 in range(40):
              s, j = 요청("/backtest/progress/probe0000001", 시한=60)
              if s == 200:
                  print(f"새 서버 확인({번 * 20}초 기다림) — 진행 묻기 {s} {j}")
                  break
              print(f"아직 예전 서버 — {s}")
              time.sleep(20)

          조건 = {"logic": "AND", "conditions": [{"indicator": "MA", "operator": "crosses_above", "value": "EMA", "period": 20}]}
          청산 = {"logic": "AND", "conditions": [{"indicator": "RSI", "operator": ">", "value": 70, "period": 14}]}
          열쇠 = "probe" + str(int(time.time()))
          t = time.time()
          s, j = 요청("/backtest/run", {"symbol": "AAPL", "market": "US", "start_date": "2021-11-05", "end_date": "2026-11-05",
                                       "initial_capital": 10000000, "entry_conditions": 조건, "exit_conditions": 청산,
                                       "progress_key": 열쇠}, 시한=180)
          print(f"\n단일 백테스트 [{s}] {time.time()-t:.1f}초")
          if isinstance(j, dict):
              a = j.get("analysis") or {}
              print("  성과:", {k: j.get(k) for k in ("total_return", "mdd", "win_rate", "total_trades")})
              print("  analysis 칸:", sorted(a), "| 해마다", len(a.get("yearly") or []), "달마다", len(a.get("monthly") or []),
                    "낙폭점", len(a.get("drawdown") or []), "깊었던", len(a.get("drawdowns") or []),
                    "들고있기", sorted((a.get("buy_and_hold") or {}).keys()))
              bh = j.get("buy_and_hold") or {}
              print("  들고 있기 곡선:", len(bh.get("curve") or []), "점")
              s2, p = 요청(f"/backtest/progress/{열쇠}", 시한=60)
              print(f"  끝난 뒤 진행 [{s2}]:", p)
          else:
              print("  ", j)

          s, j = 요청("/backtest/run", {"symbol": "AAPL", "market": "US", "start_date": "2021-11-05", "end_date": "2026-11-05",
                                       "entry_conditions": 조건, "exit_conditions": 청산, "progress_key": "짧"}, 시한=60)
          print(f"\n잘못된 열쇠 [{s}]", str(j)[:160])
          PY
          python3 -u prod.py
