## 임시 — 1:1 메시지 배포 확인. 읽기만 한다(운영에 계정을 만들거나 글을 쓰지 않는다). 확인이 끝나면 지운다.
name: 1:1 메시지 배포 확인(임시)

on:
  push:
    branches: [claude/initial-load-performance-2RJGW]
    paths: [".github/workflows/dm-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 서버(Render)와 화면(Vercel) — 새 판이 올라올 때까지 기다리며
        run: |
          cat > probe.py <<'PY'
          import json, re, time, urllib.request, urllib.error
          API = "https://stock-platform-ksmu.onrender.com/api/v1"
          WEB = "https://stock-platform-one.vercel.app"
          H = {"User-Agent": "stock-platform-probe"}

          def 묻기(주소, 바탕=API):
              try:
                  with urllib.request.urlopen(urllib.request.Request(바탕 + 주소, headers=H), timeout=90) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")
              except Exception as e:
                  return None, f"{type(e).__name__}: {e}"

          # 1) 서버 — 메시지 경로가 생겼나(로그인 없이 물으면 401, 옛 서버면 404)
          for 번 in range(75):
              s, 글 = 묻기("/community/dm/unread-count")
              print(번, "dm/unread-count", s, 글[:100], flush=True)
              if s == 401:
                  break
              time.sleep(20)
          else:
              raise SystemExit("새 서버가 안 올라왔다")
          for 주소 in ("/community/dm/threads", "/community/dm/threads/1", "/community/blocks"):
              s, 글 = 묻기(주소)
              print(주소, s, 글[:80], flush=True)
              assert s == 401, 주소

          # 2) 차단 표 — 공개 프로필이 user_blocks 를 읽는다(표가 없으면 500). 응답에 i_blocked 칸
          s, 글 = 묻기("/community/feed?page=1")
          ids = []
          try:
              ids = [it.get("user_id") for it in json.loads(글).get("items", []) if it.get("user_id")]
          except Exception as e:
              print("피드를 못 읽음", s, type(e).__name__)
          ids = list(dict.fromkeys(ids))[:3] or [1, 2, 3]
          됨 = False
          for uid in ids:
              s, 글 = 묻기(f"/community/users/{uid}/profile")
              print("profile", uid, s, 글[:200], flush=True)
              if s == 200:
                  d = json.loads(글)
                  됨 = d.get("i_blocked") is False
                  if 됨:
                      break
          if not 됨:
              raise SystemExit("공개 프로필에 i_blocked 가 없다")

          # 3) 화면 — 새 묶음에 대화 목록·대화방, 서비스워커에 메시지 푸시 처리
          for 번 in range(45):
              s, 첫 = 묻기("/", WEB)
              입구 = re.findall(r'assets/index-[A-Za-z0-9_-]+\.js', 첫 or "")
              if 입구:
                  _, 본 = 묻기("/" + 입구[0], WEB)
                  방 = sorted(set(re.findall(r'ChatRoom-[A-Za-z0-9_-]+\.js', 본 or "")))
                  목록 = sorted(set(re.findall(r'Messages-[A-Za-z0-9_-]+\.js', 본 or "")))
                  print(번, 입구[0], 방, 목록, flush=True)
                  if 방 and 목록:
                      _, 방본 = 묻기("/assets/" + 방[0], WEB)
                      찾을것 = ["대화방 메뉴", "메시지 쓰기", "이전 메시지 보기", "[overflow-anchor:none]"]
                      있나 = {k: (k in (방본 or "")) for k in 찾을것}
                      _, sw = 묻기("/sw.js", WEB)
                      sw있나 = 'type: "dm"' in (sw or "")
                      print(있나, "sw.js 메시지 푸시:", sw있나, flush=True)
                      if all(있나.values()) and sw있나:
                          print("새 화면 확인")
                          break
              else:
                  print(번, "입구를 못 찾음", s)
              time.sleep(20)
          else:
              raise SystemExit("새 화면이 안 올라왔다")
          print("서버·화면 모두 새 판")
          PY
          python3 -u probe.py
