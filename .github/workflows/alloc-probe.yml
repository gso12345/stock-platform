## 임시 — 배포 뒤 운영 서버·화면에 자산배분 상세 분석이 올라갔는지 본다. 읽기·계산만(저장하지 않는다). 확인이 끝나면 지운다.
name: 자산배분 배포 확인(임시)

on:
  push:
    branches: [claude/initial-load-performance-2RJGW]
    paths: [".github/workflows/alloc-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 운영 서버·화면 — 새 자산배분(배포가 끝날 때까지 기다리며)
        run: |
          cat > prod.py <<'PY'
          import json, re, time, urllib.request, urllib.error
          API = "https://stock-platform-ksmu.onrender.com/api/v1"
          WEB = "https://stock-platform-one.vercel.app"
          H = {"User-Agent": "stock-platform-probe", "Content-Type": "application/json"}

          def 요청(주소, 몸=None, 시한=180, 글=False):
              req = urllib.request.Request(주소, data=json.dumps(몸).encode() if 몸 else None, headers=H)
              try:
                  with urllib.request.urlopen(req, timeout=시한) as r:
                      본문 = r.read().decode("utf-8", "replace")
                      return r.status, (본문 if 글 else json.loads(본문))
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")[:300]
              except Exception as e:
                  return None, f"{type(e).__name__}: {e}"

          몸 = {"assets": [{"symbol": "SPY", "market": "US", "name": "S&P 500", "weight": 50},
                           {"symbol": "TLT", "market": "US", "name": "미국 장기국채", "weight": 30},
                           {"symbol": "현금", "market": "KR", "name": "현금", "weight": 20}],
                "currency": "KRW", "initial_amount": 10000000, "start_date": "2016-11-05", "end_date": "2026-11-05",
                "contribution_period": "monthly", "contribution_amount": 500000, "rebalance_period": "yearly",
                "total_return": True, "cost_rate": 0.1, "benchmark": "spy", "cash_rate": 3, "risk_free_rate": 0}

          j = None
          for 번 in range(45):
              t = time.time()
              s, j = 요청(API + "/backtest/portfolio", 몸)
              if s == 200 and isinstance(j, dict) and "asset_stats" in j:
                  print(f"새 서버 확인({번}번째, {time.time()-t:.1f}초)")
                  break
              print(f"아직 예전 서버 — {s} {'asset_stats 없음' if isinstance(j, dict) else str(j)[:120]}")
              time.sleep(20)
          else:
              raise SystemExit("새 서버가 안 올라왔다")

          print("기간:", j["start_date"], "~", j["end_date"], "| 넣은 돈", j["contributed"], "| 최종", j["final_value"], "| 수익", j["profit"])
          print("TWR", j["twr_annual"], "IRR", j["irr_annual"], "MDD", j["mdd"], "| 수수료", j["costs"], "| 현금 이자", j["cash_interest"], "| 배당", j["dividends"])
          합 = sum(x["contribution"] or 0 for x in j["asset_stats"]) - (j["costs"] or 0)
          print(f"자산마다 번 돈 합 − 수수료 = {합:,.2f} / 수익 {j['profit']:,.2f} → 차이 {합 - j['profit']:.4f}")
          for x in j["asset_stats"]:
              print("  ", x)
          c = j["correlation"]
          print("상관:", c and {"symbols": c["symbols"], "matrix": c["matrix"], "months": c["months"]})
          for r in j["rolling"]:
              print(f"롤링 {r['years']}년: {r['count']}번, 플러스 {r['positive_ratio']}%, 중간값 {r['median']}, 최고 {r['best']}, 최저 {r['worst']}, 첫 {r['series'][0]}")
          b = j.get("benchmark") or {}
          print("벤치마크:", b.get("name"), "| 롤링", [(r["years"], r["count"]) for r in (b.get("rolling") or [])])
          print("곡선 넣은 돈:", [(p["date"], p["value"], p.get("invested")) for p in j["curve"][:2]], "…", j["curve"][-1])
          print("기간 범위:", j.get("requested_start"), j.get("requested_end"), j.get("asset_range"))

          # ── 화면(버셀) — 새 묶음이 올라왔나
          for 번 in range(30):
              s, 첫 = 요청(WEB + "/", 글=True, 시한=60)
              입구 = re.findall(r'assets/index-[A-Za-z0-9_-]+\.js', 첫 if isinstance(첫, str) else "")
              s2, 본 = 요청(WEB + "/" + 입구[0], 글=True, 시한=60) if 입구 else (None, "")
              조각 = sorted(set(re.findall(r'AllocationTab-[A-Za-z0-9_-]+\.js', 본 if isinstance(본, str) else "")))
              if 조각:
                  s3, 글 = 요청(WEB + "/assets/" + 조각[0], 글=True, 시한=60)
                  있나 = {k: (k in 글) for k in ("언제 샀느냐에 따라", "대표 조합으로 바로 시작", "얼마나 같이 움직였나", "지표 모두 보기")}
                  print(f"화면 {입구[0]} → {조각[0]} [{s3}] {있나}")
                  if all(있나.values()):
                      print("새 화면 확인")
                      break
              else:
                  print("화면 묶음을 못 찾음", s, s2)
              time.sleep(20)
          else:
              raise SystemExit("새 화면이 안 올라왔다")
          PY
          python3 -u prod.py
