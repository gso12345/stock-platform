name: 자료 확인(임시) — 공모주 예측이 안 되는 까닭
on:
  push:
    branches: [claude/initial-load-performance-2RJGW]
    paths: [".github/workflows/probe-ipo.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 자료 원천(38커뮤니케이션)을 읽기만 해서 확인
        shell: python
        run: |
          import re, urllib.request, urllib.error, urllib.parse, time
          머리 = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
                  "Accept-Language": "ko-KR,ko;q=0.9", "Referer": "http://www.38.co.kr/"}
          def get(u, t=40):
              r = urllib.request.Request(u, headers=머리)
              try:
                  with urllib.request.urlopen(r, timeout=t) as res:
                      return res.status, res.read().decode("cp949", "replace")
              except Exception as e:
                  return 0, repr(e)[:200]
          B = "http://www.38.co.kr"
          찾을 = ("씨앤엠", "제이앤티지", "철회", "연기")
          for 이름, 경로 in (("수요예측결과", "/html/fund/index.htm?o=r1"), ("수요예측일정", "/html/fund/index.htm?o=r"),
                            ("청약일정", "/html/fund/index.htm?o=k")):
              for 쪽 in (1, 2, 3):
                  s, 글 = get(f"{B}{경로}&page={쪽}")
                  평 = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", 글)).replace("&nbsp;", " ")
                  print(f"#### {이름} {쪽}쪽 {s} {len(평)}자", flush=True)
                  for 말 in 찾을:
                      for m in list(re.finditer(말, 평))[:3]:
                          print(f"   [{말}] …{평[max(0, m.start() - 60): m.start() + 80]}…", flush=True)
                  # 이 쪽에 든 날짜 범위(일정·예측일) — 11월 초 일정이 이 쪽들에 들 만한지
                  날 = sorted(set(re.findall(r"2026\.1[01]\.\d{2}", 평)))
                  print(f"   날짜 {날[:3]} … {날[-3:]}", flush=True)
                  time.sleep(0.5)
          # 상세 번호를 몰라도 — 38 의 공모주 검색(이름)으로 찾아 본다
          for 이름 in ("씨앤엠", "제이앤티지"):
              for 주소 in (f"{B}/html/fund/index.htm?o=k&search={urllib.parse.quote(이름.encode('cp949'))}",):
                  s, 글 = get(주소)
                  평 = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", 글)).replace("&nbsp;", " ")
                  print(f"#### 검색 {이름} {s} {len(평)}자", flush=True)
                  for m in list(re.finditer(이름, 평))[:3]:
                      print(f"   …{평[max(0, m.start() - 60): m.start() + 120]}…", flush=True)
          import urllib.parse
