name: 배포 확인(임시) — 주가예측
on:
  push:
    branches: [claude/initial-load-performance-2RJGW]
    paths: [".github/workflows/probe-predict.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 운영 화면·서버를 읽기만 해서 확인
        shell: python
        run: |
          import json, re, time, urllib.request, urllib.parse, urllib.error
          WEB = "https://stock-platform-one.vercel.app"
          API = "https://stock-platform-ksmu.onrender.com/api/v1"

          def get(u, t=120):
              p = urllib.parse.urlsplit(u)
              u = urllib.parse.urlunsplit(p._replace(path=urllib.parse.quote(p.path)))
              r = urllib.request.Request(u, headers={"User-Agent": "deploy-probe"})
              try:
                  with urllib.request.urlopen(r, timeout=t) as res:
                      return res.status, res.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          # ── 1) 화면(Vercel) — 주가예측 화면 묶음이 실렸나 ──
          for 번 in range(20):
              _, html = get(WEB + "/predict")
              html = html.decode("utf-8", "replace")
              entry = [x for x in set(re.findall(r'/assets/[^"\'\s]+?\.js', html)) if "/index-" in x]
              글 = {}
              for x in entry:
                  글[x] = get(WEB + x)[1].decode("utf-8", "replace")
                  for y in set(re.findall(r'assets/[^"\'`\s)]+?\.js', 글[x])):
                      y = "/" + y
                      if y not in 글 and ("Predict-" in y or "주가예측" in y or "%EC%A3%BC" in y):
                          s, b = get(WEB + y)
                          글[y] = b.decode("utf-8", "replace") if s == 200 else ""
              표식 = {"메뉴(앱 틀)": ("/predict", "index-"), "주가예측 글자(앱 틀)": ("주가예측", "index-"),
                      "검증 카드": ("이 방식은 얼마나 맞았나", "Predict-"), "종목 고르기": ("예측할 종목", "Predict-"),
                      "예측불가": ("이 종목은 예측할 수 없어요", "Predict-")}
              결과 = {이름: any(k in s for n, s in 글.items() if 곳 in n) for 이름, (k, 곳) in 표식.items()}
              print(f"[화면 {번}] 파일 {len(글)}개 {결과}")
              if all(결과.values()):
                  break
              time.sleep(30)

          # ── 2) 서버(Render) — 새 길이 떠 있고, 실제 시세로 셈하나 ──
          for 번 in range(30):
              s, b = get(f"{API}/predict/KR/005930")
              print(f"[서버 {번}] KR/005930 → {s}")
              if s != 404 or b"detail\":\"Not Found" not in b:
                  break
              time.sleep(30)
          for 시장, 종목 in (("KR", "005930"), ("US", "AAPL"), ("KR", "000660"), ("US", "NVDA")):
              시작 = time.time()
              s, b = get(f"{API}/predict/{시장}/{종목}")
              걸림 = time.time() - 시작
              if s != 200:
                  print(시장, 종목, s, b[:200]); continue
              d = json.loads(b)
              print(f"== {d['name']}({종목}) {s} {걸림:.1f}초 · {d['as_of']} 종가 {d['price']} {d['currency']} · 일봉 {d['days_used']}일")
              print(f"   출렁임 지금 {d['volatility']['now']:.0%} 평소 {d['volatility']['long']:.0%} · 가운데 연 {d['expected_return']:.1%}")
              for h in d["horizons"]:
                  c = h["check"] or {}
                  print(f"   {h['label']:>3} {h['date']} 80%: {h['q10']}~{h['q90']} 가운데 {h['q50']} 오를 {h['up']:.0%} "
                        f"| 검증 {c.get('n')}번 80%안 {c.get('in80')} 50%안 {c.get('in50')} 겹치지않는 {c.get('periods')}")
              print("   근거:", [(g["key"], g["state"]) for g in d["signals"]], "· 길", len(d["path"]), "· 지난", len(d["history"]))
          # 두 번째는 담아 둔 것 — 빨라야 한다
          시작 = time.time(); s, _ = get(f"{API}/predict/KR/005930"); print(f"다시 물음 {s} {time.time() - 시작:.2f}초")
          # 없는 종목 — 데모로 채우지 않고 404
          s, b = get(f"{API}/predict/US/ZZZQQX")
          print("없는 종목", s, b[:160].decode("utf-8", "replace"))
