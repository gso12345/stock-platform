## 임시 — 키보드·머리 정리 배포 확인. 읽기만 한다. 확인이 끝나면 지운다.
name: 키보드·머리 정리 배포 확인(임시)

on:
  push:
    branches: [claude/initial-load-performance-2RJGW]
    paths: [".github/workflows/kb-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 화면(Vercel) — 새 묶음이 올라올 때까지 기다리며
        run: |
          cat > probe.py <<'PY'
          import re, time, urllib.request, urllib.error
          WEB = "https://stock-platform-one.vercel.app"
          H = {"User-Agent": "stock-platform-probe"}

          def 글(주소):
              try:
                  with urllib.request.urlopen(urllib.request.Request(WEB + 주소, headers=H), timeout=60) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, ""
              except Exception as e:
                  return None, f"{type(e).__name__}: {e}"

          for 번 in range(45):
              s, 첫 = 글("/")
              입구 = re.findall(r'assets/index-[A-Za-z0-9_-]+\.js', 첫 or "")
              if not 입구:
                  print(번, "입구를 못 찾음", s, flush=True); time.sleep(20); continue
              _, 본 = 글("/" + 입구[0])
              옛머리 = {"로그아웃 단추": 'title:"로그아웃"' in 본, "관리자 페이지 단추": 'title:"관리자 페이지"' in 본}
              방 = sorted(set(re.findall(r'ChatRoom-[A-Za-z0-9_-]+\.js', 본)))
              더 = sorted(set(re.findall(r'More-[A-Za-z0-9_-]+\.js', 본)))
              _, 방본 = 글("/assets/" + 방[0]) if 방 else (None, "")
              _, 더본 = 글("/assets/" + 더[0]) if 더 else (None, "")
              새것 = {"대화방 키보드 자리": "data-dm-bottom-space" in 방본, "더보기 다크 모드 스위치": "지금은 밝은 화면" in 더본}
              print(번, 입구[0], "옛 머리:", 옛머리, "새것:", 새것, flush=True)
              if not any(옛머리.values()) and all(새것.values()):
                  print("새 화면 확인")
                  break
              time.sleep(20)
          else:
              raise SystemExit("새 화면이 안 올라왔다")
          PY
          python3 -u probe.py
