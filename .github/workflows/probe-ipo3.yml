name: 자료 확인(임시) — 공모주 예측과 단순한 셈 견주기
on:
  push:
    branches: [claude/initial-load-performance-2RJGW]
    paths: [".github/workflows/probe-ipo3.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 운영 서버를 읽기만 해서 견주기
        shell: python
        run: |
          import json, statistics as st, urllib.request
          r = urllib.request.Request("https://stock-platform-ksmu.onrender.com/api/v1/ipo", headers={"User-Agent": "deploy-probe"})
          d = json.loads(urllib.request.urlopen(r, timeout=180).read())
          줄 = sorted(d["recent"], key=lambda x: x["list_date"])          # 오래된 것부터
          a = d["accuracy"]
          print("서버가 적은 성적", {k: a.get(k) for k in ("n", "hit_band_pct", "hit_rate", "median_abs_diff_pct", "direction_hit")})
          실제 = [x["actual_ratio"] for x in 줄]
          예측 = [x["pred_ratio"] for x in 줄]
          n = len(줄)
          def 성적(이름, 맞힌값, 처음=0):
              쌍 = [(p, y) for p, y in zip(맞힌값[처음:], 실제[처음:]) if p]
              차 = sorted(abs(y / p - 1) for p, y in 쌍)
              방향 = sum((p >= 1) == (y >= 1) for p, y in 쌍) / len(쌍)
              print(f"{이름:<28} {len(쌍)}곳 · ±20% 안 {sum(c <= 0.2 for c in 차) / len(차):.0%} · 보통 차이 {차[len(차) // 2]:.0%} · 공모가 위·아래 {방향:.0%}")
          print(f"\n최근 {n}곳 {줄[0]['list_date']} ~ {줄[-1]['list_date']} · 공모가 위에서 시작 {sum(y > 1 for y in 실제) / n:.0%} · "
                f"2배 이상 {sum(y >= 2 for y in 실제) / n:.0%} · 공모가 아래 {sum(y < 1 for y in 실제) / n:.0%} · 시작/공모 가운데 {st.median(실제):.2f}배")
          # 견줄 단순한 셈 — 맞힐 공모주보다 먼저 상장한 것만 쓴다(같은 날 상장은 빼고)
          날 = [x["list_date"] for x in 줄]
          def 앞(i, k):
              return [실제[j] for j in range(i) if 날[j] < 날[i]][-k:]
          처음 = 20
          성적("앱의 예측(분석)", 예측, 처음)
          성적("직전 10곳 가운데 값", [st.median(앞(i, 10)) if len(앞(i, 10)) >= 5 else None for i in range(n)], 처음)
          성적("직전 20곳 가운데 값", [st.median(앞(i, 20)) if len(앞(i, 20)) >= 5 else None for i in range(n)], 처음)
          성적("늘 공모가 그대로(1배)", [1.0] * n, 처음)
          성적("늘 1.5배", [1.5] * n, 처음)
