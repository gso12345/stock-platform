<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <!-- 브라우저에 알리는 색 모드·휴대폰 상태 표시줄 색. 기본은 다크이고, 아래 스크립트가 앱 설정대로 바꾼다.
         'dark light'(둘 다 된다)로 두면 브라우저가 기기 설정을 보고 골라서, 앱 설정과 따로 놀았다 —
         브라우저 부품(달력·고르기 목록)의 색, 크롬 '웹사이트 어둡게' 의 덧칠이 기기 설정을 따랐다(utils/테마.ts). -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f1117" />
    <!-- 기본 테마가 '시스템' 이다. 화면을 그리기 전에 라이트로 바꿔 두지 않으면
         라이트 모드 기기에서 앱이 뜨는 순간 다크로 번쩍한다(Layout 이 붙기 전).
         Layout.tsx 와 같은 규칙: 저장값 → 옛 'theme' 키 → 기기 설정.
         칠하는 것도 utils/테마.ts 의 테마적용 과 같다 — 클래스·색 모드·상태 표시줄 색을 한꺼번에(여기서는 그 파일을
         못 불러 같은 일을 다시 적었다. 둘이 같은지는 utils/__tests__/테마.test.ts 가 돌려 본다) -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("portfolio_settings") || "null");
          var t = s && s.theme;
          if (t !== "light" && t !== "dark" && t !== "system") {
            var old = localStorage.getItem("theme");
            t = old === "light" || old === "dark" ? old : "system";
          }
          var light = t === "light" || (t === "system" && window.matchMedia &&
                      window.matchMedia("(prefers-color-scheme: light)").matches);
          var html = document.documentElement;
          html.classList.toggle("light", !!light);
          html.classList.toggle("dark", !light);
          var cs = document.querySelector('meta[name="color-scheme"]');
          if (cs) cs.setAttribute("content", light ? "only light" : "dark");
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute("content", light ? "#f8fafc" : "#0f1117");
        } catch (e) {}
      })();
    </script>

    <!-- ── 폰트 ──────────────────────────────────────────────
         숫자에만 쓰는 고정폭 글꼴이다. 그런데 <link rel="stylesheet">
         는 **첫 픽셀을 막는다** — 브라우저는 이 CSS 를 다 받기 전까지
         아무것도 안 그린다. 남의 서버(fonts.googleapis.com)에 새로
         연결해서 받아야 하므로 DNS+TCP+TLS 로 왕복 세 번이 먼저 든다.
         실측으로 첫 픽셀이 그만큼 밀렸다.

         preload 로 받아 놓고 다 받은 뒤에 stylesheet 로 바꾼다. 그동안
         숫자는 기본 고정폭 글꼴로 보이고, 글꼴이 오면 바뀐다 — 화면이
         비어 있는 것보다 낫다.

         gstatic 도 미리 연결한다. 글꼴 파일(woff2)은 googleapis 가
         아니라 거기서 온다 — 한 곳만 미리 연결해 두면 나머지 왕복은
         그대로 남는다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
          onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
    </noscript>
